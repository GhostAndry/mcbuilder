plugins {
    id 'java'
}

repositories {
    mavenLocal()
}

dependencies {
    compileOnly project(':nms:nms-api')
    // BuildTools JARs for Minecraft {mc} — run BuildTools and copy them here.
    compileOnly files('lib/craftbukkit-{mc}.jar')
    compileOnly files('lib/spigot-api-{mc}.jar')
    compileOnly 'com.mojang:brigadier:1.3.10'
    compileOnly 'net.md-5:bungeecord-chat:1.21-R0.4'
}

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of({java}))
}
