name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libx11-6 libxext6 libxrender1 libfontconfig1
      - name: Generator tests
        run: python -m unittest test_generator
      - name: Build Linux
        if: runner.os == 'Linux'
        run: bash build.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd
      - name: Test GUI initialization on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a .venv-build/bin/python -c 'from mcbuilder.app import App; app = App(); app.update(); assert app.generate_btn.winfo_ismapped(); app.destroy()'
      - name: Test GUI initialization on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .venv-build/Scripts/python.exe -c "from mcbuilder.app import App; app = App(); app.update(); assert app.generate_btn.winfo_ismapped(); app.destroy()"
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -czf dist/MCBuilder-linux-x86_64.tar.gz -C dist MCBuilder
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/MCBuilder.exe -DestinationPath dist/MCBuilder-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MCBuilder-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: Publish tagged release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release with archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "MC Builder $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.zip ./*.tar.gz SHA256SUMS.txt --clobber
